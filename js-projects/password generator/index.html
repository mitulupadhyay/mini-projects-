<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Generate a<br><span>Random Password</span></h1>
        <div class="display">
            <input type="text" id="password" placeholder="Password" readonly>
            <img src="images/copy.png" alt="copy" title="Copy password" onclick="copyPassword()">
        </div>
        <div class="msg-row">
            <p id="strengthText" class="strength-text"></p>
            <p id="copiedMsg" class="copied-msg">Copied!</p>
        </div>

        <div class="options">
            <div class="length-option">
                <label for="length">Password Length</label>
                <input type="number" id="length" value="12" min="4" max="32">
            </div>

            <div class="checkbox-grid">
                <label><input type="checkbox" id="uppercase" checked> Uppercase (A-Z)</label>
                <label><input type="checkbox" id="lowercase" checked> Lowercase (a-z)</label>
                <label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
                <label><input type="checkbox" id="symbols" checked> Symbols (!@#$%)</label>
            </div>
        </div>

        <button onclick="createPassword()"> <img src="images/generate.png" alt="generate"> Generate Password</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
