<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StopWatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stopwatch">
        <h1 id="display">00:00:00</h1>
        <div class="buttons">
            <img id="stopBtn" src="images/stop.png" alt="stop">
            <img id="startBtn" src="images/start.png" alt="start">
            <img id="resetBtn" src="images/reset.png" alt="reset">
        </div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
